<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="AI-native workflow: spec, Claude Code agents, tests, review, deploy">
  <title>AI-native workflow: spec → Claude Code agents → tests → review → deploy</title>
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140d33"/>
      <stop offset="1" stop-color="#0a0718"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#512bd4"/>
      <stop offset="0.5" stop-color="#d97757"/>
      <stop offset="1" stop-color="#3ddc97"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c"><rect width="900" height="270" rx="18"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Menlo, Consolas, monospace; }
      .stage circle.ring { fill: #140d33; stroke: #3b2f7a; stroke-width: 2; }
      .stage .lit { opacity: 0; animation: lit 7s ease-out infinite; }
      .s2 .lit { animation-delay: 1.2s } .s3 .lit { animation-delay: 2.4s } .s4 .lit { animation-delay: 3.6s } .s5 .lit { animation-delay: 4.8s }
      @keyframes lit { 0% { opacity: 0 } 6% { opacity: 1 } 80% { opacity: 1 } 100% { opacity: 0 } }
      .stage text.t { font-size: 15px; font-weight: 700; fill: #e9e4ff; }
      .stage text.d { font-size: 11.5px; fill: #9a8fd1; }
      .progress { animation: grow 7s linear infinite; transform-origin: 90px 0; }
      @keyframes grow { 0% { transform: scaleX(0) } 70% { transform: scaleX(1) } 90% { transform: scaleX(1); opacity: 1 } 100% { transform: scaleX(1); opacity: 0 } }
      .tick { opacity: 0; animation: lit 7s ease-out infinite; animation-delay: 2.9s; }
    </style>
  </defs>

  <g clip-path="url(#c)">
    <rect width="900" height="270" fill="url(#cbg)"/>
    <text class="mono" x="36" y="44" font-size="12" fill="#a78bfa" letter-spacing="3">AI-NATIVE WORKFLOW</text>
    <text class="sans" x="36" y="74" font-size="22" font-weight="700" fill="#ffffff">From ticket to production — agents type, I engineer.</text>

    <!-- track -->
    <rect x="90" y="138" width="720" height="4" rx="2" fill="#2a2160"/>
    <g transform="translate(0 138)"><rect class="progress" x="90" y="0" width="720" height="4" rx="2" fill="url(#track)" filter="url(#g)"/></g>

    <!-- stages: centers at 90, 270, 450, 630, 810 -->
    <g class="stage s1 mono" text-anchor="middle">
      <circle class="ring" cx="90" cy="140" r="30"/>
      <circle class="lit" cx="90" cy="140" r="30" fill="#512bd4" fill-opacity=".35" stroke="#a78bfa" stroke-width="2" filter="url(#g)"/>
      <text x="90" y="147" font-size="20">📝</text>
      <text class="t sans" x="90" y="198">Spec</text>
      <text class="d" x="90" y="218">domain model</text>
      <text class="d" x="90" y="234">+ API contract</text>
    </g>
    <g class="stage s2 mono" text-anchor="middle">
      <circle class="ring" cx="270" cy="140" r="30"/>
      <circle class="lit" cx="270" cy="140" r="30" fill="#d97757" fill-opacity=".35" stroke="#d97757" stroke-width="2" filter="url(#g)"/>
      <text x="270" y="148" font-size="22" fill="#ffb59c">✳</text>
      <text class="t sans" x="270" y="198">Claude Code</text>
      <text class="d" x="270" y="218">agents implement</text>
      <text class="d" x="270" y="234">handlers · EF · DTOs</text>
    </g>
    <g class="stage s3 mono" text-anchor="middle">
      <circle class="ring" cx="450" cy="140" r="30"/>
      <circle class="lit" cx="450" cy="140" r="30" fill="#3ddc97" fill-opacity=".25" stroke="#3ddc97" stroke-width="2" filter="url(#g)"/>
      <text x="450" y="147" font-size="20">🧪</text>
      <text class="t sans" x="450" y="198">Tests</text>
      <text class="d" x="450" y="218">xUnit · Testcontainers</text>
      <text class="tick" x="450" y="234" font-size="11.5" fill="#3ddc97">✓ all green</text>
    </g>
    <g class="stage s4 mono" text-anchor="middle">
      <circle class="ring" cx="630" cy="140" r="30"/>
      <circle class="lit" cx="630" cy="140" r="30" fill="#60a5fa" fill-opacity=".25" stroke="#60a5fa" stroke-width="2" filter="url(#g)"/>
      <text x="630" y="147" font-size="20">🔍</text>
      <text class="t sans" x="630" y="198">Review</text>
      <text class="d" x="630" y="218">human-owned diff</text>
      <text class="d" x="630" y="234">security · perf</text>
    </g>
    <g class="stage s5 mono" text-anchor="middle">
      <circle class="ring" cx="810" cy="140" r="30"/>
      <circle class="lit" cx="810" cy="140" r="30" fill="#a78bfa" fill-opacity=".3" stroke="#c4b5fd" stroke-width="2" filter="url(#g)"/>
      <text x="810" y="147" font-size="20">🚀</text>
      <text class="t sans" x="810" y="198">Deploy</text>
      <text class="d" x="810" y="218">Docker · K8s</text>
      <text class="d" x="810" y="234">GitHub Actions</text>
    </g>

    <rect x="0.5" y="0.5" width="899" height="269" rx="18" fill="none" stroke="#a78bfa" stroke-opacity="0.35"/>
  </g>
</svg>
