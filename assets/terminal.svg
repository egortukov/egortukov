  <text class="ln" x="26" y="288" style="animation-delay:4.87s" xml:space="preserve">      <tspan fill="#c9c3ef">C# · ASP.NET Core · EF Core · PostgreSQL · Redis · RabbitMQ · Kafka</tspan></text>
