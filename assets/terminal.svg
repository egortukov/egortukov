  <text class="ln" x="26" y="192" style="animation-delay:4.55s" xml:space="preserve">      <tspan fill="#c9c3ef">Now listening on: </tspan><tspan fill="#a78bfa">https://github.com/egortukov</tspan></text>
  <text class="ln" x="26" y="216" style="animation-delay:4.71s" xml:space="preserve"><tspan fill="#3ddc97">info</tspan><tspan fill="#9a8fd1">: Profile.Role[0]</tspan></text>
