  <text class="ln" x="26" y="384" style="animation-delay:5.19s" xml:space="preserve">      <tspan fill="#c9c3ef">xUnit · Testcontainers · integration tests · CI/CD on every push</tspan></text>
  <text class="ln" x="26" y="408" style="animation-delay:5.35s" xml:space="preserve"><tspan fill="#60a5fa">dbug</tspan><tspan fill="#9a8fd1">: Profile.AI[0]</tspan></text>
  <text class="ln" x="26" y="432" style="animation-delay:5.35s" xml:space="preserve">      <tspan fill="#ffd9cc">Claude Code agents write the boilerplate — I own design &amp; review</tspan></text>
